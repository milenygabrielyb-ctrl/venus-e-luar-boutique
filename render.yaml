services:
  - type: web
    name: venus-e-luar-boutique
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node app-server.js
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: TZ
        value: America/Sao_Paulo
      - key: PDV_URL
        sync: false

  - type: web
    name: pdv-venus
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node pdv/server.js
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: TZ
        value: America/Sao_Paulo
      - key: BOUTIQUE_URL
        sync: false
